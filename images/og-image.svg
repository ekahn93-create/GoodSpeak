<svg width="2400" height="1260" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#4F46E5"/>

  <!-- Subtle radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark (centered, scaled up ~3x) -->
  <g transform="translate(490, 120) scale(1.1)">
    <!-- Bubble body + tail as single unified path -->
    <g opacity="0.15">
      <rect x="10" y="10" width="200" height="150" rx="28" ry="28" fill="white"/>
      <polygon points="60,155 30,190 100,155" fill="white"/>
    </g>
    <polygon points="123,27 72,98 104,98 72,156 149,72 111,72 143,27" fill="white" opacity="0.95"/>
  </g>

  <!-- EZSpeaks wordmark -->
  <text
    x="600"
    y="390"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="72"
    font-weight="800"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1">EZSpeaks</text>

  <!-- Tagline -->
  <text
    x="600"
    y="460"
    font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="32"
    font-weight="400"
    fill="white"
    opacity="0.8"
    text-anchor="middle"
    letter-spacing="0.5">Say it Better</text>
</svg>
